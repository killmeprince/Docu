spring:
  application:
    name: docu

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/docu}
    username: ${SPRING_DATASOURCE_USERNAME:docu}
    password: ${SPRING_DATASOURCE_PASSWORD:docu}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
  web:
    error:
      include-message: never
      include-binding-errors: never

app:
  jwt:
    secret: ${APP_JWT_SECRET}
    expiration-seconds: ${APP_JWT_EXPIRATION_SECONDS:86400}
  storage:
    path: ${APP_STORAGE_PATH:./storage}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}